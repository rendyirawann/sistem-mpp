<svg width="320" height="420" viewBox="0 0 320 420" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Gradient -->
    <defs>
        <linearGradient id="mppGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1E90FF"></stop>
            <stop offset="100%" stop-color="#3CB371"></stop>
        </linearGradient>
    </defs>

    <!-- Icon Gedung -->
    <g transform="translate(60,20)">
        <!-- Gedung kiri -->
        <path d="M40 40 L100 10 L100 200 L40 200 Z" stroke="url(#mppGradient)" stroke-width="6" fill="none" stroke-linejoin="round"></path>

        <!-- Gedung kanan -->
        <path d="M100 10 L160 40 L160 200 L100 200 Z" stroke="url(#mppGradient)" stroke-width="6" fill="none" stroke-linejoin="round"></path>

        <!-- Jendela -->
        <rect x="65" y="70" width="15" height="20" rx="2" fill="url(#mppGradient)"></rect>
        <rect x="65" y="105" width="15" height="20" rx="2" fill="url(#mppGradient)"></rect>
        <rect x="120" y="70" width="15" height="20" rx="2" fill="url(#mppGradient)"></rect>
        <rect x="120" y="105" width="15" height="20" rx="2" fill="url(#mppGradient)"></rect>

        <!-- Orbit bawah -->
        <ellipse cx="100" cy="215" rx="85" ry="14" stroke="url(#mppGradient)" stroke-width="4" fill="none"></ellipse>
    </g>

    <!-- Text MPP -->
    <text x="160" y="310" text-anchor="middle" font-size="64" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="url(#mppGradient)">
        MPP
    </text>

    <!-- Subtitle -->
    <text x="160" y="350" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#555">
        Mal Pelayanan Publik
    </text>

</svg>
